services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:17-alpine
    container_name: alramy-blog-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack for S3 emulation (development only)
  localstack:
    image: localstack/localstack:latest
    container_name: alramy-blog-localstack-dev
    restart: unless-stopped
    ports:
      - "4566:4566" # LocalStack main endpoint
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - SERVICES=${LOCALSTACK_SERVICES:-s3}
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - DATA_DIR=/var/lib/localstack
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOSTNAME=localstack
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - "./.localstack/init-s3-dev.py:/etc/localstack/init/ready.d/init-s3-dev.py" # ready hook
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: alramy-blog-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./.redis/redis-init.sh:/usr/local/bin/redis-init.sh:ro
    command: redis-init.sh
    environment:
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Persistent volumes
volumes:
  postgres_data:
    driver: local
  localstack_data:
    driver: local
  redis_data:
    driver: local
